server:
  port: 8081

spring:
  application:
    name: TalentPulseAi

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  datasource:
    url: jdbc:postgresql://localhost:5432/talentpulse_db
    username: postgres
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: always

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/recruitment-realm}

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

# Spring AI & PGvector Store Configuration
  ai:
    vectorstore:
      pgvector:
        table-name: vector_store
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024
    ollama:
      base-url: http://localhost:11434
      embedding:
        options:
          model: mxbai-embed-large

talentpulse:
  cors:
    allowed-origins: ${TALENTPULSE_CORS_ALLOWED_ORIGINS:http://localhost:4200}