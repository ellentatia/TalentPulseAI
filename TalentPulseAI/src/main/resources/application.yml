server:
  port: 8081

spring:
  application:
    name: TalentPulseAi

  datasource:
    url: jdbc:postgresql://localhost:5432/talentpulse_db
    username: postgres
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/recruitment-realm

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

# Spring AI & PGvector Store Configuration
  ai:
    vectorstore:
      pgvector:
        table-name: vector_store
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
    openai:
      api-key: ${OPENAI_API_KEY:mock-key-for-local-testing}
      embedding:
        options:
          model: text-embedding-3-small